[install]
# 使用国内镜像加速
registry = "https://registry.npmmirror.com"

# 严格 peer 依赖
peer = false

# 离线模式优先
optional = true

# 将 workspace 子包依赖提升到根 node_modules
# 这对 tsup DTS 构建等需要从根目录解析模块的场景至关重要
hoisted = true

[install.cache]
# 启用全局缓存
disable = false

[run]
# 允许运行 package.json 中的 scripts
shell = "bun"

[test]
coverage = false
exclude = ["tests/e2e/**", "node_modules/**", "dist/**", "**/dist/**"]

[build]
# 构建目标
target = "bun"
