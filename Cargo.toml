[workspace]
members = [
  "kernel",
  "runtime",
  "interfaces/cli",
  "interfaces/acp",
  "interfaces/lsp",
]
resolver = "2"

[workspace.package]
version = "1.0.0"
edition = "2021"
rust-version = "1.75"
license = "MulanPSL-2.0"

[workspace.dependencies]
arboard = { version = "3", default-features = true, features = ["image-data"] }
anyhow = "1"
chrono = "0.4"
crossterm = "0.28"
ignore = "0.4"
ratatui = "0.29"
reqwest = { version = "0.12", features = ["json", "rustls-tls", "blocking"], default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "io-std", "io-util"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tower-lsp = "0.20"
lsp-types = "0.97"
unicode-width = "0.1"
tempfile = "3"
base64 = "0.22"
