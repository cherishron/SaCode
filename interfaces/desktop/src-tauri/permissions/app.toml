[[permission]]
identifier = "app-commands"
description = "Allow SaCode Desktop custom commands"
commands.allow = [
  "start_daemon",
  "select_workspace_folder",
  "stop_daemon",
  "daemon_info",
  "daemon_proxy",
  "start_event_bridge",
  "terminal_start",
  "terminal_write",
  "terminal_resize",
  "terminal_close",
  "set_tray_enabled",
  "set_autostart",
  "system_integration_status",
  "git_workspace_status",
  "git_workspace_diff"
]
