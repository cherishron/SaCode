# SaClaw Docker Compose - 开发环境
# 使用方式: docker compose -f docker-compose.yml -f docker-compose.dev.yml up

services:
  api:
    build:
      context: .
      target: development
    container_name: saclaw-api-dev
    environment:
      - NODE_ENV=development
    volumes:
      - .:/app
      - /app/node_modules
    ports:
      - "3000:3000"
    command: pnpm --filter @saclaw/api dev

  web:
    build:
      context: .
      target: development
    container_name: saclaw-web-dev
    environment:
      - NODE_ENV=development
    volumes:
      - ./packages/web:/app/packages/web
      - /app/node_modules
    ports:
      - "5173:5173"
    command: pnpm --filter @saclaw/web dev
