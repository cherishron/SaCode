name: Desktop Release

# Builds the SaCode Desktop (Tauri 2 + Vue 3) Windows NSIS installer.
# - Triggers on `v*` tags and manual dispatch.
# - Code signing is OPTIONAL: if the SACODE_CODESIGN_CERT_BASE64 secret is set,
#   the binary + installer are Authenticode-signed (D5); otherwise an unsigned
#   build is produced (identical to local `tauri build`).
# - On a tag push, the installer is attached to the GitHub Release.

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: false

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: "Version override (e.g. 1.1.1). Leave empty to use Cargo workspace version."
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build-desktop:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: interfaces/desktop/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Resolve release version
        id: get_version
        shell: bash
        run: |
          if [[ -n "${{ github.event.inputs.version }}" ]]; then
            VERSION="${{ github.event.inputs.version }}"
          elif [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
          else
            VERSION="$(node -p "require('./npm-package/package.json').version")"
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Sync project version
        run: node scripts/sync-version.js ${{ steps.get_version.outputs.VERSION }}

      - name: Install desktop dependencies
        working-directory: interfaces/desktop
        run: npm ci

      - name: Build frontend + Tauri (NSIS)
        working-directory: interfaces/desktop
        env:
          SACODE_CODESIGN_CERT_BASE64: ${{ secrets.SACODE_CODESIGN_CERT_BASE64 }}
          SACODE_CODESIGN_CERT_PASSWORD: ${{ secrets.SACODE_CODESIGN_CERT_PASSWORD }}
        run: npm run tauri -- build

      - name: Locate installer
        id: installer
        shell: bash
        working-directory: interfaces/desktop
        run: |
          INSTALLER=$(ls target/release/bundle/nsis/*.exe | head -n1)
          echo "PATH=$INSTALLER" >> "$GITHUB_OUTPUT"
          echo "NAME=$(basename "$INSTALLER")" >> "$GITHUB_OUTPUT"

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: sacode-desktop-windows-x64
          path: interfaces/desktop/${{ steps.installer.outputs.PATH }}

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v1
        with:
          files: interfaces/desktop/${{ steps.installer.outputs.PATH }}
          append_body: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
