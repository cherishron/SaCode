name: Desktop Release

# Builds the SaCode Desktop (Tauri 2 + Vue 3) Windows NSIS installer and publishes
# it together with the Tauri updater artifacts (latest.json + .sig) to the GitHub
# Release for the pushed tag. On a manual dispatch the same bundle is produced and
# released under the supplied version.
#
# Signing (all optional, via repository secrets):
#   - TAURI_UPDATER_PRIVATE_KEY            ed25519 updater private key (updater-secret.key)
#   - TAURI_UPDATER_PRIVATE_KEY_PASSWORD   key password (empty for the generated key)
#   - SACODE_CODESIGN_CERT_BASE64          Windows Authenticode PFX (base64)  — D5
#   - SACODE_CODESIGN_CERT_PASSWORD        PFX password
# The Authenticode signCommand lives in src-tauri/tauri.conf.json and is a no-op
# when SACODE_CODESIGN_CERT_BASE64 is absent.
#
# Updater endpoint + pubkey are configured in src-tauri/tauri.conf.json.

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: false

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: "Version override (e.g. 1.1.1). Leave empty to use the Cargo workspace version."
        required: false
        default: ""

permissions:
  contents: write

jobs:
  release-desktop:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: interfaces/desktop/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Resolve release version
        id: get_version
        shell: bash
        run: |
          if [[ -n "${{ github.event.inputs.version }}" ]]; then
            VERSION="${{ github.event.inputs.version }}"
          elif [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
          else
            VERSION="$(node -p "require('./npm-package/package.json').version")"
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Sync project version
        run: node scripts/sync-version.js ${{ steps.get_version.outputs.VERSION }}

      - name: Build, sign and publish (tauri-action)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_UPDATER_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_UPDATER_PRIVATE_KEY_PASSWORD }}
          SACODE_CODESIGN_CERT_BASE64: ${{ secrets.SACODE_CODESIGN_CERT_BASE64 }}
          SACODE_CODESIGN_CERT_PASSWORD: ${{ secrets.SACODE_CODESIGN_CERT_PASSWORD }}
        with:
          projectPath: interfaces/desktop
          tagName: 'v__VERSION__'
          releaseName: 'SaCode Desktop v__VERSION__'
          releaseBody: 'See CHANGELOG for details.'
          includeUpdater: true
          args: ''
