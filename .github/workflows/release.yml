name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            artifact: sacode-linux-x64
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            artifact: sacode-win32-x64.exe

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Get version from tag
        id: get_version
        shell: bash
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Sync project version
        run: node scripts/sync-version.js ${{ steps.get_version.outputs.VERSION }}

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      - name: Prepare binary (Linux/macOS)
        if: matrix.os != 'windows-latest'
        run: |
          mv target/${{ matrix.target }}/release/sacode npm-package/platforms/${{ matrix.artifact }}
          chmod +x npm-package/platforms/${{ matrix.artifact }}

      - name: Prepare binary (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          mv target/${{ matrix.target }}/release/sacode.exe npm-package/platforms/${{ matrix.artifact }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: npm-package/platforms/${{ matrix.artifact }}

      - name: Test binary (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: npm-package/platforms/${{ matrix.artifact }} --version

      - name: Test binary (Windows)
        if: matrix.os == 'windows-latest'
        run: node npm-package/bin/sacode.js --version

  release:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: npm-package/platforms
          merge-multiple: true

      - name: Get version from tag
        id: get_version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Write platform manifest
        run: node scripts/write-platform-manifest.js ${{ steps.get_version.outputs.VERSION }}

      - name: Check release consistency
        run: node scripts/check-release.js --strict-platforms

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Publish to npm
        run: |
          cd npm-package
          npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: npm-package/platforms/*
          body: |
            ## Installation
            
            ```bash
            npm install -g @cherishron/sacode@${{ steps.get_version.outputs.VERSION }}
            ```
            
            Or download binary directly from assets below.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
