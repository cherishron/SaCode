name: VSCode Extension

on:
  push:
    branches: [main, master, dev]
    paths:
      - 'interfaces/vscode/**'
      - 'scripts/check-vscode-release.js'
      - 'scripts/normalize-vsix.py'
      - 'scripts/vscode-install-smoke.js'
      - 'docs/release/compatibility.json'
      - 'docs/release/compatibility.md'
      - '.github/workflows/vscode.yml'
  pull_request:
    branches: [main, master, dev]
    paths:
      - 'interfaces/vscode/**'
      - 'scripts/check-vscode-release.js'
      - 'scripts/normalize-vsix.py'
      - 'scripts/vscode-install-smoke.js'
      - 'docs/release/compatibility.json'
      - 'docs/release/compatibility.md'
      - '.github/workflows/vscode.yml'

jobs:
  compile-package-smoke:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    defaults:
      run:
        working-directory: interfaces/vscode

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: interfaces/vscode/package-lock.json

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: npm ci

      - name: Compile extension
        run: npm run compile

      - name: Run client tests
        run: npm test

      - name: Package VSIX
        run: npm run package:vsix

      - name: Check VSCode release contract
        working-directory: ${{ github.workspace }}
        run: node scripts/check-vscode-release.js

      - name: Install / compatibility smoke
        working-directory: ${{ github.workspace }}
        run: node scripts/vscode-install-smoke.js
