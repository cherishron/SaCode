name: Test

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

on:
  push:
    branches: [main, master, dev]
  pull_request:
    branches: [main, master, dev]

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build binary (needed by child-process tests)
        run: cargo build -p sacode-cli --bin sacode

      - name: Run tests
        run: cargo test --workspace -- --skip render_header_shows_thinking_status --skip render_input_panel_shows_thinking_indicator --skip test_shell_exec_uses_docker --skip test_code_deps_extracts_multiline --skip test_fs_patch_applies_fuzzy --skip returns_relative_paths_for_nested_matches

      - name: Build release
        run: cargo build --release

      - name: Prepare npm platforms
        run: |
          node scripts/prepare-npm-platforms.js $(node -p "require('./npm-package/package.json').version") --clean --platform linux-x64 --source-file linux-x64 target/release/sacode

      - name: Check release consistency
        run: node scripts/check-release.js

      - name: Test CLI
        run: ./target/release/sacode --version

  test-macos:
    runs-on: macos-14

    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build binary (needed by child-process tests)
        run: cargo build -p sacode-cli --bin sacode

      - name: Run tests
        run: cargo test --workspace -- --skip render_header_shows_thinking_status --skip render_input_panel_shows_thinking_indicator --skip test_shell_exec_uses_docker --skip test_code_deps_extracts_multiline --skip test_fs_patch_applies_fuzzy --skip returns_relative_paths_for_nested_matches
