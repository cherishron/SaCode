name: Test

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

on:
  push:
    branches: [main, master, dev]
  pull_request:
    branches: [main, master, dev]

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build binary (needed by child-process tests)
        run: cargo build -p sacode-cli --bin sacode

      - name: Run tests
        run: cargo test --workspace

      - name: Setup Python for quarantined tests
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run quarantined pytest integration test
        run: |
          python -m pip install pytest
          cargo test -p sacode-runtime tools::test::autofix::tests::e2e_pytest_fix_context_generates_and_repair_verifies -- --ignored --exact

      - name: Build release
        run: cargo build --release

      - name: Prepare npm platforms
        run: |
          node scripts/prepare-npm-platforms.js $(node -p "require('./npm-package/package.json').version") --clean --platform linux-x64 --source-file linux-x64 target/release/sacode

      - name: Check release consistency
        run: node scripts/check-release.js

      - name: Test CLI
        run: ./target/release/sacode --version

  test-macos:
    runs-on: macos-14

    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build binary (needed by child-process tests)
        run: cargo build -p sacode-cli --bin sacode

      - name: Run tests
        run: cargo test --workspace

  test-windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build workspace
        run: cargo build --workspace

      - name: Run unit and integration tests
        run: cargo test --workspace --lib --bins --tests

      - name: Run doctests sequentially
        shell: pwsh
        run: |
          $packages = @('sacode-kernel', 'sacode-runtime', 'sacode-acp', 'sacode-lsp', 'sacode-cli')
          foreach ($package in $packages) {
            cargo test -p $package --doc
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - name: Setup Python for quarantined tests
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run quarantined pytest integration test
        run: |
          python -m pip install pytest
          cargo test -p sacode-runtime tools::test::autofix::tests::e2e_pytest_fix_context_generates_and_repair_verifies -- --ignored --exact
